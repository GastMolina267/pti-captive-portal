name: Release/Rollout workflow
run-name: ${{ inputs.version != '' && 'Rollout' || 'Release' }} to ${{ inputs.environment }} by @${{ github.actor }}. Version ${{ inputs.version != '' && inputs.version || 'auto-generated' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (e.g., staging, production).'
        required: true
        default: 'staging'
        options:
          - staging
          - production
        type: choice
      version:
        description: 'Not required for staging releases. Required for production (e.g., v1.1.0).'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  ci-retrieve-version:
    uses: mindfactory-sw/mf-mindstack-gha/.github/workflows/mf-mindstack-version.yaml@main
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
      tagging-environment: staging
    permissions:
      contents: write
      issues: write
      pull-requests: write

  build:
    needs: [ci-retrieve-version]
    uses: mindfactory-sw/mf-mindstack-gha/.github/workflows/mf-mindstack-build.yaml@main
    secrets: inherit
    with:
      CREATE_ENV_FILE: true
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
      VERSION: ${{ needs.ci-retrieve-version.outputs.version }}

  deploy:
    needs: [build, ci-retrieve-version]
    uses: mindfactory-sw/mf-mindstack-gha/.github/workflows/mf-mindstack-deploy.yaml@main
    secrets: inherit
    with:
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ needs.ci-retrieve-version.outputs.version }}
